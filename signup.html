<html>
    <head>
        <title>Signup</title>
                 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
         <style>
            .card{
                width:350px;
                margin-left:400px;
                margin-top:80px;
            }
            body{
                background:#244886;
            }
            
         </style>
    </head>
    <body>
        <div class="container">
            <div class="card p-3 text-center">
                <h3>Create Account</h3>
                <input type="text" id="name" placeholder="Username" class="form-control mt-3">
                <input type="email" id="mail" placeholder="Email" class="form-control mt-3">
                  <input type="password" id="password" placeholder="Password" class="form-control mt-3">
                  <button class="btn btn-success mt-4" onclick="register()">Register</button>
                  <p class="mt-3">Already have account?<span class="text-primary" onclick="back()">Login</span></p>
                  <p class="mt-3 text-danger" id="result"></p>
            </div>
        </div>
        <script>
            async function register() {
                let username = document.getElementById("name").value;
            let email = document.getElementById("mail").value;
             let password = document.getElementById("password").value;
            let response = await fetch(`http://localhost:8080/register?username=${username}&email=${email}&password=${password}`,
                {
                    method:"POST"
                }
            );
            let data = await response.text();
            document.getElementById("result").innerHTML = data;
                
            }
            function back(){
                window.location.href = "login.html";
            }
        </script>
    </body>
</html>
