<html>
    <head>
        <title>Login</title>
                 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
         <style>
            .card{
                width:350px;
                margin-left:400px;
                margin-top:80px;
            }
            body{
                background:#244886;
            }
            .btn{
                background:#244886;
                color:white;
            }
         </style>
    </head>
    <body>
        <div class="container">
            <div class="card p-3 text-center">
                <h3>Login</h3>
                <input type="email" id="mail" placeholder="Email" class="form-control mt-3">
                  <input type="password" id="password" placeholder="Password" class="form-control mt-3">
                  <button class="btn mt-4" onclick="login()">Login</button>
                  <p class="mt-3">New User?<span class="text-primary" onclick="create()">Create Account</span></p>
            </div>
        </div>
        <script>
            async function login() {
            let email = document.getElementById("mail").value;
             let password = document.getElementById("password").value;
            let response = await fetch(`http://localhost:8080/login?email=${email}&password=${password}`,
                {
                    method:"POST"
                }
            );
            let data = await response.text();
            if(data ==="success"){
                window.location.href = "dashboard.html";
            }
            else{
                alert("Invalid password");
            }    
            }
            function create(){
                window.location.href = "signup.html";
            }
        </script>
    </body>
</html>
