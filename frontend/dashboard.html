<html>
    <head>
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
       <style>
        #summary{
            background:#244886;
            color:white;
        }
        .card{
            border-radius:10px;
            border:none;
        }
       </style>
    </head>
    <body class="bg-light">
        <div class="container">
            <div class="row mt-5">
                <div class="col-md-8">
                    <div class="card p-3">
                        <h3 class="text-primary"><i class="bi bi-wallet"></i> My Expense Wallet</h3>
                        <input type="text" id="title" placeholder="Expense Title" class="form-control mt-3">
                          <input type="number" id="amount" placeholder="Amount" class="form-control mt-3">
                          <select id="type" class="form-select mt-3">
                            <option value="" disabled selected>Select</option>
                            <option value="credit">Credit</option>
                             <option value="debit">Debit</option>
                          </select>
                          <button onclick="add()" class="btn btn-success mt-4">Add Transaction</button>
                          <button onclick="reset()" class="btn btn-danger mt-4">Reset</button>
                          <table class="table table-bordered mt-3">
                            <thead class="table-dark">
                                <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="tablebody"></tbody>
                          </table>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3" id="summary">
                        <h5><i class="bi bi-wallet"></i> Wallet Summary</h5>
                        <hr>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <p>Total Credit:</p>
                            </div>
                             <div class="col-md-6">
                                <p id="totalcredit">₹ 0</p>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <p>Total Debit:</p>
                            </div>
                             <div class="col-md-6">
                                <p id="totaldebit">₹ 0</p>
                            </div>
                        </div>
                        <br>
                        <br>
                        <p>Available Balance</p>
                        <h3 id="availablebalance" class="text-success">₹ 0</h3>
                        <p>Total Transaction: <span id="totaltransaction"></span></p>
                        <p>Wallet is Healthy</p>
                    </div>
                </div>
            </div>
        </div>
        <script>
           async function add() {
        let title = document.getElementById("title").value;
        let amount = document.getElementById("amount").value;
        let type = document.getElementById("type").value;
  let response = await fetch(`http://localhost:8080/add?title=${title}&type=${type}&amount=${amount}`);
    let data = await response.json();
    loadwallet();
    loadsummary();
    walletcount();
     document.getElementById("title").value = "";
      document.getElementById("amount").value = "";
       document.getElementById("type").value = "";
            
           }
           async function loadwallet() {
              let date = new Date().toLocaleDateString();
        let response = await fetch(`http://localhost:8080/summarywallet`);
        let walletdata = await response.json();
        let row = "";
        console.log(walletdata);
        for(let t of walletdata){
            let badge = (t.type=="credit")
            ?"<span class='btn btn-success btn-sm'>credit</span>"
             :"<span class='btn btn-danger btn-sm'>Debit</span>";
            row +=`
            <tr>
                <td>${date}</td>
                <td>${t.title}</td>
                <td>${badge}</td>
                <td>${t.amount}</td>
                </tr>
                `;
                
        }
        document.getElementById("tablebody").innerHTML = row;
     
           }
           loadwallet();
           async function loadsummary() {
            let response = await fetch(`http://localhost:8080/summarywallet`);
            let data = await response.json();
            console.log(data);
            for(let n of data){
                 document.getElementById("totalcredit").innerHTML = "₹" + n.credit;
               document.getElementById("totaldebit").innerHTML = "₹" +  n.debit;
                  document.getElementById("availablebalance").innerHTML = "₹" +  n.balance;
            }

            }
            loadsummary();
           async function walletcount() {
            let response = await fetch(`http://localhost:8080/walletcount`);
            let walletcount = await response.text();
            document.getElementById("totaltransaction").innerHTML = walletcount;
            
           }
           walletcount();
           function reset(){
            document.getElementById("totalcredit").innerHTML = "";
             document.getElementById("totaldebit").innerHTML = "";
                  document.getElementById("availablebalance").innerHTML = "";
                    document.getElementById("totaltransaction").innerHTML = "";

           }
           
            
           
       
        </script>

    </body>
</html>
